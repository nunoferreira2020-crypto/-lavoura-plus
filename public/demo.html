<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f6f44"><title>Lavoura+ — Demonstração</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f4;color:#1e2922;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #dfe6df;padding:calc(10px + env(safe-area-inset-top)) 16px 10px}.brand{font-size:22px;font-weight:900}.demo{margin-top:4px;font-size:12px;font-weight:800;color:#9a6200;background:#fff2cc;display:inline-block;padding:4px 8px;border-radius:999px}.wrap{max-width:720px;margin:auto;padding:16px 16px 100px}.hello h1,h1{margin:4px 0 12px;font-size:26px}.muted{color:#68746b}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}.card{background:#fff;border:1px solid #e0e7e1;border-radius:18px;padding:15px;margin-bottom:12px;box-shadow:0 2px 8px #00000008}.stat strong{display:block;font-size:25px}.stat span{font-size:12px;color:#68746b;font-weight:700}.title{font-size:17px;font-weight:900;margin-bottom:10px}.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid #edf0ed}.row:first-of-type{border-top:0}.row.click{cursor:pointer}.badge{font-size:12px;font-weight:900;padding:4px 8px;border-radius:999px;background:#e7f4ea;color:#28613a;white-space:nowrap;height:max-content}.warn{background:#fff1d6;color:#875800}.danger{background:#fde7e7;color:#8b3030}.blue{background:#e7f0ff;color:#315f97}.nav{position:fixed;bottom:0;left:0;right:0;z-index:10;background:#fff;border-top:1px solid #dfe6df;padding:8px 6px calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:space-around}.nav button{border:0;background:none;font-size:11px;color:#526057;font-weight:700;min-width:58px}.nav button.active{color:#2f6f44}.nav b{display:block;font-size:20px}.note{font-size:12px;line-height:1.45;background:#eef5ff;border-radius:14px;padding:12px;color:#35506d}.btn{width:100%;border:0;border-radius:14px;padding:13px 14px;background:#2f6f44;color:#fff;font-weight:800;font-size:15px;margin-top:8px}.btn.secondary{background:#edf3ee;color:#2f6f44}.back{border:0;background:none;padding:0 0 10px;color:#2f6f44;font-weight:800;font-size:15px}.search{width:100%;border:1px solid #dfe6df;border-radius:14px;padding:13px 14px;font-size:16px;margin:4px 0 12px;background:#fff}.tabs{display:flex;gap:8px;overflow-x:auto;margin:8px 0 14px;padding-bottom:2px}.tab{border:1px solid #d9e4da;border-radius:999px;padding:9px 12px;background:#fff;color:#315c3d;font-weight:800;white-space:nowrap}.tab.active{background:#2f6f44;color:#fff;border-color:#2f6f44}.big{font-size:32px;font-weight:900}.mini{font-size:12px}.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px}.menu button{background:#fff;border:1px solid #e0e7e1;border-radius:18px;padding:18px 12px;text-align:left;font-weight:900;font-size:15px}.menu button span{display:block;font-size:24px;margin-bottom:7px}.timeline .row{align-items:flex-start}.pill{display:inline-block;margin:3px 5px 0 0;padding:5px 8px;border-radius:999px;background:#f0f4f1;font-size:12px;font-weight:800}.fake-write{background:#fff8e5;border:1px solid #f0dfac;border-radius:14px;padding:12px;font-size:13px;color:#795c00}.chart{display:flex;align-items:flex-end;gap:7px;height:120px;padding-top:15px}.bar{flex:1;background:#d8e8db;border-radius:7px 7px 2px 2px;min-width:14px;position:relative}.bar span{position:absolute;bottom:-20px;font-size:9px;color:#68746b;left:50%;transform:translateX(-50%)}@media(max-width:420px){.menu{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr 1fr}.split{grid-template-columns:1fr}}
</style></head>
<body><header class="top"><div class="brand">🌱 Lavoura+</div><div class="demo">DEMONSTRAÇÃO · DADOS FICTÍCIOS</div></header><main id="app" class="wrap"></main><nav id="nav" class="nav"></nav>
<script>
const cows=[
{id:'1001',name:'Estrela',breed:'Holstein-Frísia',status:'Prenhe',ia:'18/05/2026',bull:'DYNAMO',semen:'Sexado',calving:'25/02/2027',dry:'27/12/2026',health:[]},
{id:'1008',name:'Lua',breed:'Holstein-Frísia',status:'A confirmar',ia:'15/07/2026',bull:'IMPERIAL',semen:'Sexado',calving:'24/04/2027',dry:'23/02/2027',health:[]},
{id:'1014',name:'Branca',breed:'Holstein-Frísia',status:'Prenhe',ia:'09/11/2025',bull:'PASS',semen:'Convencional',calving:'18/08/2026',dry:'15/08/2026',health:[]},
{id:'1017',name:'Nuvem',breed:'Holstein-Frísia',status:'Prenhe',ia:'02/03/2026',bull:'QUINTAB22',semen:'Sexado',calving:'10/12/2026',dry:'11/10/2026',health:[{date:'11/08/2026',type:'Mastite',med:'Mastijet',dose:'1 seringa',withdraw:'15/08/2026'}]},
{id:'1021',name:'Pérola',breed:'Holstein-Frísia',status:'Prenhe',ia:'12/11/2025',bull:'PASS',semen:'Convencional',calving:'21/08/2026',dry:'22/06/2026',health:[]},
{id:'1027',name:'Rosa',breed:'Holstein-Frísia',status:'Vazia',ia:'20/06/2026',bull:'IMPERIAL',semen:'Sexado',calving:'—',dry:'—',health:[]},
{id:'1032',name:'Flor',breed:'Holstein-Frísia',status:'Prenhe',ia:'30/04/2026',bull:'DYNAMO',semen:'Sexado',calving:'07/02/2027',dry:'09/12/2026',health:[]},
{id:'1036',name:'Mimosa',breed:'Holstein-Frísia',status:'Lactação',ia:'—',bull:'—',semen:'—',calving:'—',dry:'—',health:[]}
]
const milk=[{d:'12/08',l:714},{d:'11/08',l:705},{d:'10/08',l:698},{d:'09/08',l:721},{d:'08/08',l:716},{d:'07/08',l:709},{d:'06/08',l:702}]
const analyses=[{d:'11/08/2026',fat:'3,91%',protein:'3,27%',cells:'184 mil',ufc:'12 mil'},{d:'25/07/2026',fat:'3,84%',protein:'3,22%',cells:'205 mil',ufc:'16 mil'},{d:'10/07/2026',fat:'3,79%',protein:'3,20%',cells:'231 mil',ufc:'19 mil'}]
let screen='home',animalFilter='Todos',query=''
const app=document.getElementById('app'),nav=document.getElementById('nav')
const navItems=[['home','🏠','Início'],['animals','🐄','Animais'],['repro','🧬','Reprodução'],['milk','🥛','Produção'],['more','•••','Mais']]
function navRender(){nav.innerHTML=navItems.map(([id,ic,t])=>`<button class="${screen===id?'active':''}" onclick="go('${id}')"><b>${ic}</b>${t}</button>`).join('')}
function go(s){screen=s;window.scrollTo({top:0});render()}
function header(title,sub=''){return `<button class="back" onclick="go('home')">← Voltar</button><h1>${title}</h1>${sub?`<p class="muted">${sub}</p>`:''}`}
function card(title,body){return `<section class="card"><div class="title">${title}</div>${body}</section>`}
function home(){return `<section class="hello"><div class="muted">Exploração Demonstração</div><h1>Bom dia 👋</h1><div class="muted">Veja rapidamente o que precisa de atenção.</div></section><div class="grid"><div class="card stat" onclick="go('animals')"><strong>36</strong><span>🐄 Animais</span></div><div class="card stat"><strong>31</strong><span>🥛 Em lactação</span></div><div class="card stat" onclick="go('milk')"><strong>714 L</strong><span>Produção hoje</span></div><div class="card stat"><strong>23,0 L</strong><span>Por vaca/dia</span></div></div>${card('📅 Agenda',`<div class="row click" onclick="animal('1008')"><div><b>Vaca 1008</b><br><span class="muted">Diagnóstico de prenhez</span></div><span class="badge warn">Hoje</span></div><div class="row click" onclick="animal('1014')"><div><b>Vaca 1014</b><br><span class="muted">Secagem prevista</span></div><span class="badge">3 dias</span></div><div class="row click" onclick="animal('1021')"><div><b>Vaca 1021</b><br><span class="muted">Parto previsto</span></div><span class="badge blue">6 dias</span></div>`)}${card('🩺 Saúde',`<div class="row click" onclick="animal('1017')"><div><b>Vaca 1017</b><br><span class="muted">Mastite · tratamento registado</span></div><span class="badge danger">Leite em carência</span></div>`)}${card('🌾 Alimentação',`<div class="row"><span>Ração</span><b>7,5 kg/vaca</b></div><div class="row"><span>Milho</span><b>1,5 kg/vaca</b></div><div class="row"><span>Custo alimentar</span><b>0,19 €/L</b></div>`)}<p class="note"><b>Modo demonstração.</b> Esta página não inicia sessão, não consulta a base de dados e não contém dados da exploração real.</p>`}
function animals(){let f=cows.filter(c=>(animalFilter==='Todos'||c.status===animalFilter)&&(c.id.includes(query.toLowerCase())||c.name.toLowerCase().includes(query.toLowerCase())));return `${header('🐄 Animais','Dados fictícios para demonstração')}<input class="search" placeholder="Pesquisar número ou nome" value="${query}" oninput="query=this.value;render()"><div class="tabs">${['Todos','Prenhe','A confirmar','Vazia'].map(x=>`<button class="tab ${animalFilter===x?'active':''}" onclick="animalFilter='${x}';render()">${x}</button>`).join('')}</div>${card(`${f.length} animais visíveis`,f.map(c=>`<div class="row click" onclick="animal('${c.id}')"><div><b>🐄 ${c.id} · ${c.name}</b><br><span class="muted">${c.breed}</span></div><span class="badge ${c.status==='Vazia'?'danger':c.status==='A confirmar'?'warn':''}">${c.status}</span></div>`).join('')||'<p class="muted">Nenhum animal encontrado.</p>')}`}
function animal(id){const c=cows.find(x=>x.id===id);screen='animal';app.innerHTML=`<button class="back" onclick="go('animals')">← Animais</button><h1>🐄 ${c.id} · ${c.name}</h1><p class="muted">${c.breed}</p><div class="grid"><div class="card stat"><strong>${c.status}</strong><span>Estado atual</span></div><div class="card stat"><strong>${c.ia==='—'?'0':'2'}</strong><span>IA registadas</span></div></div>${card('🧬 Reprodução',`<div class="row"><span>Última IA</span><b>${c.ia}</b></div><div class="row"><span>Touro</span><b>${c.bull}</b></div><div class="row"><span>Sémen</span><b>${c.semen}</b></div><div class="row"><span>Secagem prevista</span><b>${c.dry}</b></div><div class="row"><span>Parto previsto</span><b>${c.calving}</b></div>`)}${card('🩺 Saúde e tratamentos',c.health.length?c.health.map(h=>`<div class="row"><div><b>${h.type}</b><br><span class="muted">${h.date} · ${h.med} · ${h.dose}</span></div><span class="badge danger">Carência até ${h.withdraw}</span></div>`).join(''):'<p class="muted">Sem tratamentos recentes.</p>')}${card('🕘 Histórico',`<div class="timeline"><div class="row"><span>IA · ${c.bull}</span><b>${c.ia}</b></div>${c.health.map(h=>`<div class="row"><span>${h.type} · ${h.med}</span><b>${h.date}</b></div>`).join('')}<div class="row"><span>Parto</span><b>14/10/2025</b></div></div>`)}<div class="fake-write">Nesta demonstração, os botões de gravação não alteram dados reais. É apenas para mostrar o funcionamento.</div><button class="btn" onclick="alert('Demonstração: aqui seria registada uma nova inseminação.')">＋ Nova inseminação</button><button class="btn secondary" onclick="alert('Demonstração: aqui seria registado um diagnóstico.')">🩺 Registar diagnóstico</button>`;navRender()}
function repro(){return `${header('🧬 Reprodução','Gestão reprodutiva do rebanho')}<div class="grid"><div class="card stat"><strong>22</strong><span>✅ Prenhes</span></div><div class="card stat"><strong>3</strong><span>🩺 A confirmar</span></div><div class="card stat"><strong>2</strong><span>❌ Vazias</span></div><div class="card stat"><strong>4</strong><span>🔵 Partos ≤30d</span></div></div>${card('Prioridades',`<div class="row click" onclick="animal('1008')"><div><b>1008 · Diagnóstico</b><br><span class="muted">28 dias após IA</span></div><span class="badge warn">Hoje</span></div><div class="row click" onclick="animal('1014')"><div><b>1014 · Secagem</b></div><span class="badge">3 dias</span></div><div class="row click" onclick="animal('1021')"><div><b>1021 · Parto</b></div><span class="badge blue">6 dias</span></div>`)}${card('Últimas inseminações',`<div class="row"><span>1008 · IMPERIAL</span><b>15/07/2026</b></div><div class="row"><span>1027 · IMPERIAL</span><b>20/06/2026</b></div><div class="row"><span>1001 · DYNAMO</span><b>18/05/2026</b></div>`)}`}
function milkScreen(){const max=Math.max(...milk.map(x=>x.l));return `${header('🥛 Produção','Produção e qualidade do tanque')}<div class="grid"><div class="card stat"><strong>714 L</strong><span>Hoje</span></div><div class="card stat"><strong>23,0 L</strong><span>Vaca/dia</span></div><div class="card stat"><strong>708 L</strong><span>Média 7 dias</span></div><div class="card stat"><strong>+2,3%</strong><span>vs semana anterior</span></div></div>${card('📈 Últimos 7 dias',`<div class="chart">${milk.slice().reverse().map(x=>`<div class="bar" style="height:${Math.round(x.l/max*100)}%"><span>${x.d}</span></div>`).join('')}</div><div style="height:18px"></div>`)}${card('🧪 Última análise',`<div class="row"><span>Gordura</span><b>${analyses[0].fat}</b></div><div class="row"><span>Proteína</span><b>${analyses[0].protein}</b></div><div class="row"><span>Células</span><b>${analyses[0].cells}</b></div><div class="row"><span>UFC</span><b>${analyses[0].ufc}</b></div><button class="btn secondary" onclick="go('analyses')">Ver histórico de análises</button>`)}`}
function analysesScreen(){return `${header('🧪 Análises do leite','Histórico fictício do tanque')}${analyses.map(a=>card(a.d,`<div class="row"><span>Gordura</span><b>${a.fat}</b></div><div class="row"><span>Proteína</span><b>${a.protein}</b></div><div class="row"><span>Células</span><b>${a.cells}</b></div><div class="row"><span>UFC</span><b>${a.ufc}</b></div>`)).join('')}<div class="fake-write">Na app real, pode adicionar valores manualmente ou reconhecer uma análise por fotografia/captura de ecrã.</div>`}
function health(){return `${header('🩺 Saúde e tratamentos','Histórico sanitário por vaca')}<div class="grid"><div class="card stat"><strong>5</strong><span>Registos este mês</span></div><div class="card stat"><strong>1</strong><span>Leite em carência</span></div></div>${card('Carência ativa',`<div class="row click" onclick="animal('1017')"><div><b>🐄 1017 · Nuvem</b><br><span class="muted">Mastite · Mastijet</span></div><span class="badge danger">Até 15/08</span></div>`)}${card('Histórico recente',`<div class="row"><span>1017 · Mastite</span><b>11/08</b></div><div class="row"><span>1004 · Desparasitação</span><b>05/08</b></div><div class="row"><span>1025 · Preventivo</span><b>29/07</b></div>`)}<button class="btn" onclick="alert('Demonstração: aqui seria criado um novo registo de saúde.')">＋ Novo registo</button>`}
function feed(){return `${header('🌾 Alimentação','Custos alimentares e eficiência')}<div class="grid"><div class="card stat"><strong>0,19 €</strong><span>Custo alimentar/L</span></div><div class="card stat"><strong>4,37 €</strong><span>Custo/vaca/dia</span></div></div>${card('Ração atual',`<div class="row"><span>Especial grão</span><b>7,5 kg/vaca</b></div><div class="row"><span>Milho</span><b>1,5 kg/vaca</b></div><div class="row"><span>Pastagem</span><b>À vontade</b></div>`)}${card('Custos',`<div class="row"><span>Ração</span><b>0,41 €/kg</b></div><div class="row"><span>Milho</span><b>0,33 €/kg</b></div><div class="row"><span>Total diário</span><b>135,47 €</b></div>`)}<button class="btn" onclick="alert('Demonstração: aqui seria atualizado o arraçoamento.')">Atualizar alimentação</button>`}
function finance(){return `${header('💶 Finanças e rentabilidade','Exemplo com valores fictícios')}<div class="grid"><div class="card stat"><strong>0,43 €</strong><span>Preço/L</span></div><div class="card stat"><strong>0,34 €</strong><span>Custo/L</span></div><div class="card stat"><strong>0,09 €</strong><span>Margem/L</span></div><div class="card stat"><strong>1.928 €</strong><span>Margem estimada/mês</span></div></div>${card('Despesas mensais',`<div class="row"><span>Alimentação</span><b>4.064 €</b></div><div class="row"><span>Fertilizantes</span><b>1.120 €</b></div><div class="row"><span>Gasóleo</span><b>430 €</b></div><div class="row"><span>Veterinário</span><b>180 €</b></div><div class="row"><span>Outras</span><b>690 €</b></div>`)}${card('Receita estimada',`<div class="row"><span>Leite/mês</span><b>21.420 L</b></div><div class="row"><span>Receita leite</span><b>9.211 €</b></div>`)}`}
function reports(){return `${header('📊 Relatórios','Resumo automático da exploração')}${card('Este mês',`<div class="row"><span>Produção média</span><b>708 L/dia</b></div><div class="row"><span>IA realizadas</span><b>6</b></div><div class="row"><span>Diagnósticos positivos</span><b>4</b></div><div class="row"><span>Partos</span><b>3</b></div><div class="row"><span>Tratamentos</span><b>5</b></div>`)}${card('💡 Leitura automática',`<p>A produção está <b>2,3% acima</b> da semana anterior. As células somáticas desceram de 205 para 184 mil. Há <b>1 vaca com leite em carência</b> e <b>3 diagnósticos de prenhez</b> a realizar.</p>`)}`}
function agenda(){return `${header('📅 Agenda da exploração','Tudo o que precisa de atenção num só sítio')}${card('Hoje',`<div class="row click" onclick="animal('1008')"><span>🩺 Diagnóstico · 1008</span><span class="badge warn">Hoje</span></div>`)}${card('Próximos dias',`<div class="row click" onclick="animal('1014')"><span>🟠 Secagem · 1014</span><b>15/08</b></div><div class="row click" onclick="animal('1017')"><span>🥛 Fim carência · 1017</span><b>15/08</b></div><div class="row click" onclick="animal('1021')"><span>🔵 Parto · 1021</span><b>18/08</b></div>`)}`}
function more(){return `${header('••• Mais','Outras áreas da Lavoura+')}<div class="menu"><button onclick="go('health')"><span>🩺</span>Saúde</button><button onclick="go('feed')"><span>🌾</span>Alimentação</button><button onclick="go('finance')"><span>💶</span>Finanças</button><button onclick="go('analyses')"><span>🧪</span>Análises leite</button><button onclick="go('agenda')"><span>📅</span>Agenda</button><button onclick="go('reports')"><span>📊</span>Relatórios</button></div><p class="note">Todos estes ecrãs usam apenas dados inventados dentro desta página. Não existe qualquer ligação à conta ou à exploração real.</p>`}
function render(){navRender();const pages={home,animals,repro,milk:milkScreen,more,analyses:analysesScreen,health,feed,finance,reports,agenda};if(screen==='animal')return;app.innerHTML=(pages[screen]||home)()}
render()
</script></body></html>
