<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#245c3b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Lavoura+" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="application-name" content="Lavoura+" />
  <meta name="description" content="Gestão da exploração leiteira" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./lavoura-icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./lavoura-icon.svg" />
  <link rel="stylesheet" href="./src/professional-ui.css?v=2" />
  <title>Lavoura+</title>
</head>
<body>
  <div id="app"></div>

  <!-- Núcleo estável da aplicação. Módulos pesados são carregados apenas
       quando necessários para reduzir trabalho de MutationObserver no iPhone. -->
  <script type="module" src="/src/main.js?v=stable-1"></script>
  <script type="module" src="/src/auth-public-fixes.js?v=2"></script>
  <script type="module" src="/src/iphone-public-fixes.js?v=3"></script>

  <script type="module">
    let milkOcrPromise = null

    function loadMilkOcr() {
      if (!milkOcrPromise) {
        milkOcrPromise = import('/src/milk-ocr.js?v=3')
          .catch(error => {
            milkOcrPromise = null
            console.error('OCR do leite:', error)
          })
      }
      return milkOcrPromise
    }

    document.addEventListener('pointerdown', event => {
      if (event.target.closest('[data-action="fotografia-analise-leite"], #fotografiaAnaliseLeite')) {
        loadMilkOcr()
      }
    }, true)

    document.addEventListener('focusin', event => {
      if (event.target?.id === 'fotografiaAnaliseLeite') {
        loadMilkOcr()
      }
    }, true)
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        const serviceWorkerUrl = new URL('./sw.js', window.location.href)
        navigator.serviceWorker.register(serviceWorkerUrl).catch(error => console.error('Service Worker:', error))
      })
    }
  </script>
</body>
</html>
