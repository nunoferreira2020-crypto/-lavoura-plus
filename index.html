<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#245c3b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Lavoura+" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="application-name" content="Lavoura+" />
  <meta name="description" content="Gestão da exploração leiteira" />
  <link rel="preconnect" href="https://oegbnvwwrudnskycgbdl.supabase.co" crossorigin />
  <link rel="dns-prefetch" href="https://oegbnvwwrudnskycgbdl.supabase.co" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./lavoura-icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./lavoura-icon.svg" />
  <link rel="stylesheet" href="./src/professional-ui.css?v=2" />
  <title>Lavoura+</title>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="./src/main.js?v=stable-1"></script>
  <script type="module" src="./src/auth-public-fixes.js?v=2"></script>
  <script type="module" src="./src/iphone-public-fixes.js?v=3"></script>
  <script type="module" src="./src/reproduction-wheel.js?v=embrapa-3"></script>
  <script type="module">
    const deferredModules=['./src/cow-names.js','./src/production-quality-sync.js','./src/production-trends.js','./src/milk-insights.js','./src/pregnancy-labels.js','./src/reproductive-stage-v2.js','./src/postpartum-cycle.js','./src/postpartum-reproduction-summary-v2.js','./src/open-cow-reinsemination.js','./src/reproductive-summary.js','./src/reproductive-timeline.js','./src/overdue-pregnancy-diagnostics.js','./src/herd-tools-v2.js','./src/health-tools.js','./src/health-dashboard.js','./src/farm-agenda.js','./src/feed-tools.js','./src/feed-dashboard.js','./src/cow-profile.js','./src/finance-insights.js','./src/finance-profit-chart.js','./src/finance-monthly-history.js','./src/rentability-sync.js','./src/reports-final.js','./src/dashboard-smart.js','./src/settings-security.js']
    let secondaryModulesPromise=null
    function loadSecondaryModules(){if(!secondaryModulesPromise){secondaryModulesPromise=Promise.all(deferredModules.map(modulePath=>import(modulePath).catch(error=>{console.error(`Módulo ${modulePath}:`,error);return null})))}return secondaryModulesPromise}
    if('requestIdleCallback' in window){window.requestIdleCallback(loadSecondaryModules,{timeout:1200})}else{window.setTimeout(loadSecondaryModules,250)}
    let milkOcrPromise=null
    function loadMilkOcr(){if(!milkOcrPromise){milkOcrPromise=import('./src/milk-ocr.js?v=3').catch(error=>{milkOcrPromise=null;console.error('OCR do leite:',error)})}return milkOcrPromise}
    document.addEventListener('pointerdown',event=>{if(event.target.closest('[data-action="fotografia-analise-leite"], #fotografiaAnaliseLeite'))loadMilkOcr()},true)
    document.addEventListener('focusin',event=>{if(event.target?.id==='fotografiaAnaliseLeite')loadMilkOcr()},true)
  </script>
  <script>
    if('serviceWorker' in navigator){window.addEventListener('load',()=>{const serviceWorkerUrl=new URL('./sw.js',window.location.href);navigator.serviceWorker.register(serviceWorkerUrl).catch(error=>console.error('Service Worker:',error))})}
  </script>
</body>
</html>
